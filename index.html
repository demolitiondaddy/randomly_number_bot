<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020602">
  <title>Random number simulations (generator)</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    .outer-ring {
  position: absolute;
  width: calc(var(--circle-size) + 34px);
  height: calc(var(--circle-size) + 34px);
  border-radius: 999px;
  border: 3px solid rgba(52, 255, 126, 0.75);
  box-shadow:
    0 0 12px rgba(52, 255, 126, 0.35),
    0 0 28px rgba(52, 255, 126, 0.22),
    inset 0 0 12px rgba(52, 255, 126, 0.12);
  z-index: 0;
}
    :root {
      color-scheme: dark;
      --green: #3cff81;
      --text: #e9fff0;
      --muted: #9aceab;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #020602; color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    #backgroundVideo { position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center; background: #000; z-index: 0; }
    body::before { content: ""; position: fixed; inset: 0; z-index: 1;
      pointer-events: none; background: rgba(0, 0, 0, .18); }
    .screen { position: fixed; inset: 0; z-index: 2; display: flex;
      align-items: center; justify-content: center; padding: 18px; }
    .hidden { display: none !important; }
    .panel { width: min(440px, 100%); padding: 26px 22px;
      border: 1px solid rgba(60, 255, 129, .30); border-radius: 22px;
      background: rgba(1, 11, 5, .90); box-shadow: 0 0 32px rgba(32, 170, 84, .14); }
    h1 { margin: 0 0 12px; color: var(--green); font-size: clamp(22px, 5vw, 27px);
      font-weight: 750; line-height: 1.2; text-align: center; }
    .description { margin: 0 0 24px; color: var(--muted);
      font-size: 14px; line-height: 1.5; text-align: center; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: block; margin-bottom: 7px; color: var(--muted);
      font-size: 12px; font-weight: 600; letter-spacing: .04em; }
    input { display: block; width: 100%; min-width: 0; padding: 13px 12px;
      color: var(--text); background: #07140b;
      border: 1px solid #245934; border-radius: 12px;
      font: inherit; font-size: 16px; outline: none; }
    input:focus { border-color: var(--green); box-shadow: 0 0 0 2px #3cff8130; }
    .limits { margin: 14px 0 20px; color: var(--muted);
      font-size: 12px; text-align: center; }
    .error { min-height: 18px; margin-bottom: 8px; color: #ff8f8f;
      font-size: 13px; text-align: center; }
    button { display: block; width: 100%; padding: 15px;
      color: #031407; background: var(--green); border: 0; border-radius: 13px;
      font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; }
    button:active { transform: scale(.985); }
    /* Center of this overlay matches the center of the final video frame. */
    #resultScreen { pointer-events: none; }
    #resultNumber { position: absolute; left: 50%; top: 50%; width: min(63vw, 300px);
      transform: translate(-50%, calc(-50% - 90px)) scale(.75);
      color: #eefff2; text-align: center; font-size: clamp(15px, 4.5vw, 26px);
      font-weight: 850; font-variant-numeric: tabular-nums;
      letter-spacing: -.035em; line-height: 1.15;
      text-shadow: 0 0 13px #3cff817a, 0 2px 7px #000;
      overflow-wrap: anywhere; opacity: 0; }
    #resultNumber.drop { animation: fall .85s cubic-bezier(.18,.92,.18,1) forwards; }
    @keyframes fall {
      0% { opacity: 0; transform: translate(-50%, calc(-50% - 100px)) scale(.7); }
      65% { opacity: 1; transform: translate(-50%, calc(-50% + 11px)) scale(1.06); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    #continueButton { position: absolute; bottom: max(28px, env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%); width: min(420px, calc(100% - 36px));
      pointer-events: auto; }
    @media (max-width: 360px) {
      .fields { grid-template-columns: 1fr; }
      .panel { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <video id="backgroundVideo" muted playsinline preload="auto">
    <source src="./assets/video.mp4" type="video/mp4">
  </video>

  <main id="inputScreen" class="screen">
    <section class="panel">
      <h1>Random number simulations (generator)</h1>
      <p class="description">Enter minimum and maximum values to generate a random integer within your range.</p>
      <div class="fields">
        <div>
          <label for="minInput">MINIMUM</label>
          <input id="minInput" type="text" inputmode="numeric" value="0" autocomplete="off">
        </div>
        <div>
          <label for="maxInput">MAXIMUM</label>
          <input id="maxInput" type="text" inputmode="numeric" value="0" autocomplete="off">
        </div>
      </div>
      <p class="limits">Allowed values: −10<sup>15</sup> to 10<sup>15</sup></p>
      <div id="errorText" class="error" role="alert"></div>
      <button id="generateButton" type="button">Generate</button>
    </section>
  </main>

  <section id="resultScreen" class="screen hidden" aria-label="Random number result">
    <div id="resultNumber" aria-live="polite"></div>
    <button id="continueButton" class="hidden" type="button">Continue</button>
  </section>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setBackgroundColor('#020602');
      tg.setHeaderColor('#020602');
    }

    const LOWEST = -(10n ** 15n);
    const HIGHEST = 10n ** 15n;
    const video = document.getElementById('backgroundVideo');
    const inputScreen = document.getElementById('inputScreen');
    const resultScreen = document.getElementById('resultScreen');
    const resultNumber = document.getElementById('resultNumber');
    const minInput = document.getElementById('minInput');
    const maxInput = document.getElementById('maxInput');
    const errorText = document.getElementById('errorText');
    const continueButton = document.getElementById('continueButton');

    function getRange() {
      const integerPattern = /^[+-]?\d+$/;
      const minText = minInput.value.trim();
      const maxText = maxInput.value.trim();
      if (!integerPattern.test(minText) || !integerPattern.test(maxText)) {
        throw new Error('Enter valid whole numbers.');
      }
      const min = BigInt(minText);
      const max = BigInt(maxText);
      if (min < LOWEST || max > HIGHEST) {
        throw new Error('Values must be between −10¹⁵ and 10¹⁵.');
      }
      if (min > max) {
        throw new Error('Minimum cannot be greater than maximum.');
      }
      return { min, max };
    }

    // Rejection sampling prevents modulo bias; BigInt keeps every integer exact.
    function randomBelow(limit) {
      const bits = (limit - 1n).toString(2).length;
      const byteCount = Math.ceil(bits / 8);
      const bytes = new Uint8Array(byteCount);
      const sourceRange = 1n << BigInt(byteCount * 8);
      const cutoff = sourceRange - sourceRange % limit;
      while (true) {
        crypto.getRandomValues(bytes);
        let value = 0n;
        for (const byte of bytes) value = (value << 8n) | BigInt(byte);
        if (value < cutoff) return value % limit;
      }
    }

    function secureInteger(min, max) {
      return min + randomBelow(max - min + 1n);
    }

    let timer = null;
    let revealed = false;

    function showNumber(number) {
      if (revealed) return;
      revealed = true;
      clearTimeout(timer);
      video.pause(); // Keep the final video frame on screen.
      resultNumber.textContent = number.toString();
      resultNumber.classList.remove('drop');
      void resultNumber.offsetWidth;
      resultNumber.classList.add('drop');
      continueButton.classList.remove('hidden');
    }

    async function generate() {
      errorText.textContent = '';
      let range;
      try {
        range = getRange();
      } catch (error) {
        errorText.textContent = error.message;
        return;
      }
      if (!window.crypto?.getRandomValues) {
        errorText.textContent = 'Secure randomness is not available in this browser.';
        return;
      }
      const number = secureInteger(range.min, range.max);
      revealed = false;
      resultNumber.textContent = '';
      resultNumber.classList.remove('drop');
      continueButton.classList.add('hidden');
      inputScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      video.pause();
      video.currentTime = 0;
      video.onended = () => showNumber(number);
      timer = setTimeout(() => showNumber(number), 6000);
      try {
        await video.play();
      } catch (error) {
        showNumber(number);
      }
    }

    function continueToRange() {
      clearTimeout(timer);
      video.onended = null;
      video.pause();
      video.currentTime = 0;
      resultScreen.classList.add('hidden');
      inputScreen.classList.remove('hidden');
      resultNumber.classList.remove('drop');
      continueButton.classList.add('hidden');
    }

    document.getElementById('generateButton').addEventListener('click', generate);
    continueButton.addEventListener('click', continueToRange);
  </script>
</body>
</html>
